name: Build MultiPaper

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build server and master
        run: ./gradlew createPaperclipJar :multipaper-master:shadowJar --stacktrace
      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: multipaper-server
          path: MultiPaper-Server/build/libs/multipaper-server-paperclip-*.jar
          if-no-files-found: error
      - name: Upload master jar
        uses: actions/upload-artifact@v4
        with:
          name: multipaper-master
          path: MultiPaper-Master/build/libs/multipaper-master*.jar
          if-no-files-found: error
